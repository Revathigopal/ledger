{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Change password</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password <input name="current_password" type="password" autocomplete="current-password" required></label>
    <label>New password <input name="new_password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
    <label>Confirm new password <input name="confirm_password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
    <button type="submit">Change password</button>
  </form>
</section>
{% endblock %}
